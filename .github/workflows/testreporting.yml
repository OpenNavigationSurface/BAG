name: Test Reporting

on:
  push:
    paths-ignore:
      - 'docs/**'
      - readme.*
      - README.*
      - 'CHANGES.txt'
      - '*.md'
      - '*.svg'
      - .github/workflows/testmatrix.yml
      - .github/workflows/testwindows.yml
    branches: [ "master" ]
  pull_request:
    paths-ignore:
      - 'docs/**'
      - readme.*
      - README.*
      - 'CHANGES.txt'
      - '*.md'
      - '*.svg'
      - .github/workflows/testwindows.yml
    branches: [ "master" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Debug
  CC: gcc
  CXX: g++

jobs:
  build:
    env:
      PUBLISH_COVERAGE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
    strategy:
      matrix:
        os: [ubuntu-24.04]
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ${{matrix.os}}

    steps:

    - name: Display GitHub context variables
      env:
        GITHUB_CONTEXT: ${{ toJson(github) }}
      run: |
        echo "PUBLISH_COVERAGE: ${PUBLISH_COVERAGE}"
        echo "$GITHUB_CONTEXT"

    # Get current banch name to use it as dest directory
    - name: Extract branch name
      shell: bash
      run: echo "branch=$(echo ${GITHUB_REF#refs/heads/})" >> $GITHUB_OUTPUT
      id: extract_branch

    - name: Prepare environment
      id: coverage
      run: |
        # Output values to be used by other steps
        echo "path=${BADGE_PATH}" >> $GITHUB_OUTPUT
        echo "branch=${BRANCH}" >> $GITHUB_OUTPUT
      env:
        BADGE_PATH: ${{ steps.extract_branch.outputs.branch }}/coverage.svg
        BRANCH: badges

    - name: Checkout
      uses: actions/checkout@v7
      with:
        repository: ${{ github.event.pull_request.head.repo.full_name }}
        ref: ${{ github.event.pull_request.head.ref }}
    
    - name: Install dependencies
      run: |
        echo "Working directory for installing dependencies: $PWD" 
        bash ./scripts/install-dependencies-cov.sh
        ls -l $PWD

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: |
        export CC=${{env.CC}}
        export CXX=${{env.CXX}}
        # We need to configure lcov before our CMake environment is initialized...
        printf 'branch_coverage = 1\nno_exception_branch = 1\n' > "${HOME}/.lcovrc"
        cmake -G Ninja -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -B build -S . -DCMAKE_INSTALL_PREFIX=/usr/local -DBAG_BUILD_EXAMPLES:BOOL=ON -DBAG_BUILD_TESTS:BOOL=ON -DBAG_CODE_COVERAGE:BOOL=ON

    - name: Build
      # Build your program with the given configuration
      run: |
        export CC=${{env.CC}}
        export CXX=${{env.CXX}}
        cmake --build build

    - name: Run tests
      run: |
        export BAG_SAMPLES_PATH=${{github.workspace}}/examples/sample-data
        export BAG_HOME=${{github.workspace}}/configdata
        ./build/tests/bag_tests_d -r junit | tee build/tests/bag_tests-testreport.xml

    - name: Test Reporter
      uses: mikepenz/action-junit-report@v5
      if: ${{ env.PUBLISH_COVERAGE == 'true' && (success() || failure()) }} # always run even if the previous step fails
      with:
        report_paths: './build/tests/*-testreport.xml'

    - name: Run test coverage
      # Execute C++ tests
      run: |
        export BAG_SAMPLES_PATH=${{github.workspace}}/examples/sample-data
        export BAG_HOME=${{github.workspace}}/configdata
        ls -la ${HOME}
        cat "${HOME}/.lcovrc"
        rm -f "${RUNNER_TEMP}/ccov-out.txt"
        ninja -C build ccov-bag_tests > "${RUNNER_TEMP}/ccov-out.txt"
        echo "Coverage output at ${RUNNER_TEMP}/ccov-out.txt contents..."
        cat "${RUNNER_TEMP}/ccov-out.txt"
        ls -R ./build/ccov/
        source "${{github.workspace}}/python-venv/bin/activate"
        echo "Using Python: $(which python)..."
        echo "Before badge, RUNNER_TEMP contents: $(ls $RUNNER_TEMP)"
        echo "Running ${{github.workspace}}/scripts/coverage-badge.py with contents: $(cat ${{github.workspace}}/scripts/coverage-badge.py)"
        cat "${RUNNER_TEMP}/ccov-out.txt" | grep 'branches....:' | xargs -I {} python "${{github.workspace}}/scripts/coverage-badge.py" -o "${RUNNER_TEMP}/coverage.svg" -c '{}'
        echo "Before deactivate, RUNNER_TEMP contents: $(ls $RUNNER_TEMP)"
        deactivate
        echo "At end of step, RUNNER_TEMP contents: $(ls $RUNNER_TEMP)"

    - name: Test coverage reporter
      uses: pavi2410/html-preview-action@v5
      if: ${{ env.PUBLISH_COVERAGE == 'true' }}
      with:
        html_file: ccov/bag_tests/index.html
        site_root: build
        job_summary: true

    - name: Checkout badges branch
      if: ${{ env.PUBLISH_COVERAGE == 'true' }}
      # Checkout badges branch of repo so that we can commit the coverage badge there
      uses: actions/checkout@v7
      with:
        ref: ${{ steps.coverage.outputs.branch }}

    - name: Create coverage badge destination directory
      if: ${{ env.PUBLISH_COVERAGE == 'true' }}
      # Create the directory where badges will be saved, if needed
      env:
        BADGE_PATH: ${{ steps.coverage.outputs.path }}
      run: mkdir -p "${BADGE_PATH%/*}"

    - name: Update coverage badge and commit
      if: ${{ env.PUBLISH_COVERAGE == 'true' }}
      continue-on-error: true
      env:
        BADGE: ${{ steps.coverage.outputs.path }}
      run: |
        ls "${RUNNER_TEMP}"
        mv "${RUNNER_TEMP}/coverage.svg" "${BADGE}"
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add "${BADGE}"
        git commit -m "Add/Update badge"

    - name: Push badge commit
      if: ${{ env.PUBLISH_COVERAGE == 'true' && success() }}
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ steps.coverage.outputs.branch }}
